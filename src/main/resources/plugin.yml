name: WorldGuardInteractExt
version: 1.0
main: fr.feneck91.worldguardinteractext.WorldGuardInteractExt
api-version: 1.20
depend: [WorldGuard]
commands:
  wgiextreload:
    description: Reload the configuration file.
    permission-message: You do not have permission to use this command.
    usage: "Usage: /wgiextreload"
    permission: wgiext.reload
  wgiextmaterials:
    description: Display all materials for __CAMPFIRE__.
    permission-message: You do not have permission to use this command.
    usage: "Usage: /wgiextmaterials <material type>"
    permission: wgiext.wgiextmaterials
permissions:
  wgiext.reload:
    description: Allow to reload the plugin configuration.
    default: op
  wgiext.materials:
    description: Allow to display material available for plugin type.
    default: op
